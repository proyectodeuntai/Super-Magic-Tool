name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copia solo los assets web a dist/ y genera config.js desde los
      # secrets del repositorio (robusto ante comillas y caracteres raros).
      - name: Preparar archivos y generar config.js
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          mkdir -p dist/css dist/js dist/assets/fonts
          cp index.html structure.html dist/
          cp css/style.css dist/css/
          cp js/script.js js/card-utils.js dist/js/
          cp assets/magic_icon_toolbox.svg dist/assets/
          cp assets/fonts/*.woff2 dist/assets/fonts/
          touch dist/.nojekyll
          # Cache-busting: añade a css/js/icono/fuente su hash corto como ?v=,
          # para que cada cambio se vea sin recarga forzada (y lo que no cambia
          # se reutilice).
          CSS_HASH=$(sha256sum dist/css/style.css | cut -c1-8)
          JS_HASH=$(sha256sum dist/js/script.js | cut -c1-8)
          CU_HASH=$(sha256sum dist/js/card-utils.js | cut -c1-8)
          ICON_HASH=$(sha256sum dist/assets/magic_icon_toolbox.svg | cut -c1-8)
          sed -i "s|css/style.css|css/style.css?v=$CSS_HASH|g" dist/index.html dist/structure.html
          sed -i "s|js/script.js|js/script.js?v=$JS_HASH|g" dist/index.html dist/structure.html
          sed -i "s|js/card-utils.js|js/card-utils.js?v=$CU_HASH|g" dist/structure.html
          sed -i "s|assets/magic_icon_toolbox.svg|assets/magic_icon_toolbox.svg?v=$ICON_HASH|g" dist/index.html dist/structure.html
          # Fuentes auto-alojadas: versiona cada woff2 dentro de style.css.
          for f in dist/assets/fonts/*.woff2; do
            h=$(sha256sum "$f" | cut -c1-8)
            name=$(basename "$f")
            sed -i "s|assets/fonts/$name|assets/fonts/$name?v=$h|g" dist/css/style.css
          done
          node <<'EOF' > dist/config.js
          const cfg = {
            apiKey: (process.env.FIREBASE_API_KEY || '').trim(),
            authDomain: (process.env.FIREBASE_AUTH_DOMAIN || '').trim(),
            databaseURL: (process.env.FIREBASE_DATABASE_URL || '').trim(),
            projectId: (process.env.FIREBASE_PROJECT_ID || '').trim(),
            storageBucket: (process.env.FIREBASE_STORAGE_BUCKET || '').trim(),
            messagingSenderId: (process.env.FIREBASE_MESSAGING_SENDER_ID || '').trim(),
            appId: (process.env.FIREBASE_APP_ID || '').trim()
          };
          console.log('const FIREBASE_CONFIG = ' + JSON.stringify(cfg, null, 2) + ';');
          EOF

      - name: Deploy a gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
